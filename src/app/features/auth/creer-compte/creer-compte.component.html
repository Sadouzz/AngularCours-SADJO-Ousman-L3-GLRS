<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="text-center mb-5">
            <h1 class="h2 fw-bold text-dark mb-3">Créer un Compte Patient</h1>
            <p class="text-muted">Inscrivez-vous pour accéder à nos services de rendez-vous médicaux</p>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
                <h2 class="h4 fw-bold text-center mb-4">Informations Personnelles</h2>

                <form action="#" method="POST">
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="nom" class="form-label fw-semibold">Nom *</label>
                            <input type="text" class="form-control" id="nom" name="nom" placeholder="Votre nom"
                                required>
                        </div>
                        <div class="col-md-6">
                            <label for="prenom" class="form-label fw-semibold">Prénom *</label>
                            <input type="text" class="form-control" id="prenom" name="prenom" placeholder="Votre prénom"
                                required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="telephone" class="form-label fw-semibold">Téléphone *</label>
                        <input type="tel" class="form-control" id="telephone" name="telephone"
                            placeholder="Ex: 06 12 34 56 78" required>
                    </div>

                    <div class="mb-4">
                        <label for="dateNaissance" class="form-label fw-semibold">Date de Naissance *</label>
                        <input type="date" class="form-control" id="dateNaissance" name="dateNaissance" required>
                    </div>

                    <div class="mb-4">
                        <label for="email" class="form-label fw-semibold">Adresse Email *</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="votre@email.com"
                            required>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="password" class="form-label fw-semibold">Mot de Passe *</label>
                            <input type="password" class="form-control" id="password" name="password"
                                placeholder="Votre mot de passe" required>
                        </div>
                        <div class="col-md-6">
                            <label for="password_confirm" class="form-label fw-semibold">Confirmer le Mot de Passe
                                *</label>
                            <input type="password" class="form-control" id="password_confirm" name="password_confirm"
                                placeholder="Confirmez votre mot de passe" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="maladies" class="form-label fw-semibold">Maladies / Allergies connues</label>
                        <textarea class="form-control" id="maladies" name="maladies" rows="4"
                            placeholder="Listez vos maladies chroniques ou allergies connues (optionnel)"></textarea>
                    </div>

                    <div class="d-flex gap-3 mt-5">
                        <button type="submit" class="btn btn-secondary flex-grow-1 rounded-0">Créer mon compte</button>
                        <a routerLink="/dashboard" class="btn btn-outline-secondary flex-grow-1 rounded-0">Annuler</a>
                    </div>
                </form>
            </div>
        </div>

        <div class="card border-0 shadow-sm mt-4">
            <div class="card-body text-center p-4">
                <p class="mb-3">Vous avez déjà un compte ?</p>
                <a routerLink="/connexion" class="btn btn-outline-secondary btn-lg rounded-0">Se Connecter</a>
            </div>
        </div>
    </div>
</div>
