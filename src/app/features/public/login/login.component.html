<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="text-center mb-5">
            <h1 class="h2 fw-bold text-dark mb-3">Connexion</h1>
            <p class="text-muted">Connectez-vous à votre compte patient</p>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
                <h2 class="h4 fw-bold text-center mb-4">Se Connecter</h2>

                <form #loginForm="ngForm" (ngSubmit)="onLogin()">
                    <div class="mb-4">
                        <label for="email" class="form-label fw-semibold">Adresse Email</label>
                        <input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="votre@email.com"
                            required [(ngModel)]="userLogin.email">
                    </div>
                
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Mot de Passe</label>
                        <input type="password" class="form-control form-control-lg" id="password" name="password"
                            placeholder="Votre mot de passe" required [(ngModel)]="userLogin.password">
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember">
                            <label class="form-check-label" for="remember">
                                Se souvenir de moi
                            </label>
                        </div>
                        <a href="#" class="text-decoration-none text-secondary">Mot de passe oublié ?</a>
                    </div>

                    <button type="submit" class="btn btn-secondary btn-lg w-100 mb-3 rounded-0">Se Connecter</button>
                </form>
            </div>
        </div>

        <div class="card border-0 shadow-sm mt-4">
            <div class="card-body text-center p-4">
                <p class="mb-3">Vous n'avez pas encore de compte ?</p>
                <a routerLink="/creer-compte" class="btn btn-outline-secondary btn-lg rounded-0">Créer un Compte</a>
            </div>
        </div>
    </div>
</div>
